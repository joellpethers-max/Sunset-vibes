];

const STICKERS = ["🌅", "🥂", "🔥", "✨", "💃", "🕶️", "❤️", "👑", "🎶", "🍾"];

const TEXT_COLORS = [

{ id: "nude", hex: "#E8B4B8", bg: "rgba(9, 1, 5, 0.85)" },
{ id: "gold", hex: "#FBBF24", bg: "rgba(9, 1, 5, 0.85)" },

];

const INSPIRATIONAL_QUOTES = [
"“Los mejores atardeceres son los que se comparten. Captura cada instante.”",
"“Hoy el cielo se viste de rosa y borgoña. ¡Haz que esta noche sea eterna!”",
"“Congela las sonrisas, los brindis y la magia de este Sunset.”"
];

// Procesar y hornear edición (Recorte + Filtro + Texto + Sticker) directamente en la Imagen Base64
const bakeEditedImage = (rawDataUrl, { filterCss, cropRatio, overlayText, textColorObj, textYPos, sticker }) => {
return new Promise((resolve, reject) => {
const img = new Image();
img.src = rawDataUrl;
img.onload = () => {
let srcX = 0, srcY = 0, srcW = img.width, srcH = img.height;

if (cropRatio) {
const currentRatio = srcW / srcH;
if (currentRatio > cropRatio) {
srcW = srcH * cropRatio;
srcX = (img.width - srcW) / 2;
} else {
srcH = srcW / cropRatio;
srcY = (img.height - srcH) / 2;
}
}

const maxDim = 820;
let outW = srcW;
let outH = srcH;
if (outW > maxDim) {
outH = Math.round((outH * maxDim) / outW);
outW = maxDim;
}
if (outH > maxDim) {
outW = Math.round((outW * maxDim) / outH);
outH = maxDim;
}

const canvas = document.createElement("canvas");
canvas.width = outW;
canvas.height = outH;
const ctx = canvas.getContext("2d");

if (filterCss && filterCss !== "none") {
ctx.filter = filterCss;
}
ctx.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, outW, outH);
ctx.filter = "none";

// Dibujar Sticker si existe
if (sticker) {
const stickerSize = Math.round(outW * 0.14);
ctx.font = `${stickerSize}px sans-serif`;
ctx.textAlign = "right";
ctx.textBaseline = "top";
ctx.fillText(sticker, outW - 22, 22);
}

// Dibujar Texto Superpuesto si existe
if (overlayText && overlayText.trim()) {
const fontSize = Math.max(20, Math.round(outW * 0.048));
ctx.font = `800 ${fontSize}px "Plus Jakarta Sans", sans-serif`;
ctx.textAlign = "center";
ctx.textBaseline = "middle";

const yCoord = Math.round((textYPos / 100) * outH);
const textStr = overlayText.trim();
const metrics = ctx.measureText(textStr);
const padX = 24;
const padY = 14;
const boxW = Math.min(outW - 24, metrics.width + padX * 2);
const boxH = fontSize + padY * 2;

ctx.fillStyle = textColorObj?.bg || "rgba(9, 1, 5, 0.75)";
ctx.beginPath();
ctx.roundRect((outW - boxW) / 2, yCoord - boxH / 2, boxW, boxH, 16);
ctx.fill();

ctx.fillStyle = textColorObj?.hex || "#FFFFFF";
ctx.fillText(textStr, outW / 2, yCoord, outW - 40);
}

resolve(canvas.toDataURL("image/jpeg", 0.74));
};
img.onerror = (e) => reject(e);
});
};

// Comprimir foto simple (ej. avatar)
const compressSimpleImage = (file, maxWidth = 420, quality = 0.78) => {
return new Promise((resolve, reject) => {
const reader = new FileReader();
reader.readAsDataURL(file);
reader.onload = (ev) => {
const img = new Image();
img.src = ev.target.result;
img.onload = () => {
const canvas = document.createElement("canvas");
let w = img.width, h = img.height;
if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
canvas.width = w; canvas.height = h;
canvas.getContext("2d").drawImage(img, 0, 0, w, h);
resolve(canvas.toDataURL("image/jpeg", quality));
};
img.onerror = reject;
};
reader.onerror = reject;
});
};

// Procesar Video de máximo 15 segundos
const processVideoFile = (file) => {
return new Promise((resolve, reject) => {
if (file.size > 790 * 1024) {
reject(new Error("El video supera los 780 KB para la base de datos gratuita. Graba unos segundos menos."));
return;
}
const video = document.createElement("video");
video.preload = "metadata";
video.onloadedmetadata = () => {
window.URL.revokeObjectURL(video.src);
if (video.duration > 15.6) {
reject(new Error(`El video dura ${Math.round(video.duration)}s. El máximo es de 15 segundos.`));
return;
}
const reader = new FileReader();
reader.readAsDataURL(file);
reader.onload = () => resolve({ dataUrl: reader.result, duration: Math.round(video.duration) });
reader.onerror = () => reject(new Error("Error al leer el video."));
};
video.onerror = () => reject(new Error("Formato de video no compatible."));
video.src = URL.createObjectURL(file);
});
};

// Estado Online (activo en los últimos 90 seg)
const isUserOnline = (u) => {
if (!u || u.isOnline === false || !u.lastSeen) return false;
return (Date.now() - u.lastSeen) < 95000;
};

// Renderizar video o imagen con filtros/stickers superpuestos (para videos editados)
function MediaRenderer({ item, className = "w-full object-cover", onDoubleClick, autoPlay = false, controls = true }) {
const filterObj = MEDIA_FILTERS.find(f => f.id === item.filterId) || MEDIA_FILTERS[0];
const textColorObj = TEXT_COLORS.find(c => c.id === item.overlayColorId) || TEXT_COLORS[0];

if (item.mediaType === "video") {
return (
<div className="relative w-full h-full flex items-center justify-center bg-black overflow-hidden" onDoubleClick={onDoubleClick}>
<video
src={item.mediaUrl}
controls={controls}
autoPlay={autoPlay}
playsInline
style={{ filter: filterObj.css }}
className={className}
/>
{item.overlaySticker && (
<span className="absolute top-3 right-3 text-4xl pointer-events-none drop-shadow-lg">
{item.overlaySticker}
</span>
)}
{item.overlayText && (
<div
style={{
top: `${item.overlayYPos || 50}%`,
backgroundColor: textColorObj.bg,
color: textColorObj.hex
}}
className="absolute left-1/2 -translate-x-1/2 -translate-y-1/2 px-4 py-1.5 rounded-xl font-extrabold text-sm text-center pointer-events-none shadow-lg max-w-[88%]"
>
{item.overlayText}
</div>
)}
</div>
);
}

return (
<img
src={item.mediaUrl}
alt={item.caption || "Sunset Vibes"}
onDoubleClick={onDoubleClick}
className={className}
/>
);
}

function SunsetVibesApp() {
const [fbReady, setFbReady] = useState(!!window.FB);
const [authSession, setAuthSession] = useState(null);
const [users, setUsers] = useState([]);
const [posts, setPosts] = useState([]);
const [stories, setStories] = useState([]);
const [messages, setMessages] = useState([]);

// Navegación
const [activeTab, setActiveTab] = useState("feed"); // feed | search | chat | profile | admin
const [chatSubTab, setChatSubTab] = useState("group"); // group | private
const [activeChatFriend, setActiveChatFriend] = useState(null);
const [searchQuery, setSearchQuery] = useState("");
const [quoteIndex, setQuoteIndex] = useState(0);

// Perfil de otro invitado visitado y Vista Pantalla Completa de Post
const [viewedProfileUid, setViewedProfileUid] = useState(null);
const [fullscreenPostId, setFullscreenPostId] = useState(null);

// Reto al azar
const [currentChallenge, setCurrentChallenge] = useState(() =>
PHOTO_CHALLENGES[Math.floor(Math.random() * PHOTO_CHALLENGES.length)]
);

// Modales
const [uploadModal, setUploadModal] = useState({ open: false, type: "post", withChallenge: false });
const [qrModalOpen, setQrModalOpen] = useState(false);
const [shareModalPost, setShareModalPost] = useState(null);
const [editProfileModal, setEditProfileModal] = useState(false);
const [adminEditPost, setAdminEditPost] = useState(null);
const [adminEditUser, setAdminEditUser] = useState(null);

// Estados de Autenticación (Google o @usuario + contraseña)
const [authMode, setAuthMode] = useState("login"); // login | register
const [loginUsername, setLoginUsername] = useState("");
const [loginPassword, setLoginPassword] = useState("");
const [authError, setAuthError] = useState("");

// Completar registro tras Google Login o Registro nuevo
const [setupUsername, setSetupUsername] = useState("");
const [setupPassword, setSetupPassword] = useState("");
const [setupAvatar, setSetupAvatar] = useState("");
const [setupError, setSetupError] = useState("");

// Estudio de Edición de Foto/Video al subir
const [rawMediaUrl, setRawMediaUrl] = useState("");
const [mediaType, setMediaType] = useState("image");
const [videoDuration, setVideoDuration] = useState(0);
const [selectedFilter, setSelectedFilter] = useState(MEDIA_FILTERS[0]);
const [selectedCrop, setSelectedCrop] = useState(CROP_RATIOS[0]);
const [overlayText, setOverlayText] = useState("");
const [overlayColor, setOverlayColor] = useState(TEXT_COLORS[0]);
const [overlayYPos, setOverlayYPos] = useState(50);
const [overlaySticker, setOverlaySticker] = useState("");
const [caption, setCaption] = useState("");
const [mediaError, setMediaError] = useState("");
const [isSubmitting, setIsSubmitting] = useState(false);

// Visor de Historias Agrupadas estilo Instagram
const [storyViewer, setStoryViewer] = useState({
open: false,
groupIndex: 0,
storyIndex: 0,
paused: false,
progress: 0
});
const touchStartXRef = useRef(null);
const longPressTimerRef = useRef(null);
const wasLongPressRef = useRef(false);

// Comentarios y Chat
const [commentInputs, setCommentInputs] = useState({});
const [chatText, setChatText] = useState("");

// Editar Perfil propio
const [newProfileAvatar, setNewProfileAvatar] = useState("");
const [newProfileUsername, setNewProfileUsername] = useState("");
const [newProfilePassword, setNewProfilePassword] = useState("");
const [profileEditError, setProfileEditError] = useState("");

// Notificaciones internas
const [inAppToast, setInAppToast] = useState(null);
const [unreadChatCount, setUnreadChatCount] = useState(0);
const [unreadStoriesCount, setUnreadStoriesCount] = useState(0);
const prevMessagesLenRef = useRef(null);
const prevStoriesLenRef = useRef(null);

// Rotación de frases
useEffect(() => {
const t = setInterval(() => setQuoteIndex(p => (p + 1) % INSPIRATIONAL_QUOTES.length), 4500);
return () => clearInterval(t);
}, []);

// Esperar Firebase
useEffect(() => {
if (window.FB) setFbReady(true);
else {
const onReady = () => setFbReady(true);
window.addEventListener("firebase-ready", onReady);
return () => window.removeEventListener("firebase-ready", onReady);
}
}, []);

// Escuchar Auth y Colecciones de Firestore en vivo
useEffect(() => {
if (!fbReady || !window.FB) return;
const { auth, db, onAuthStateChanged, collection, onSnapshot, query, orderBy } = window.FB;

const unsubAuth = onAuthStateChanged(auth, (u) => {
if (u) {
setAuthSession({
uid: u.uid,
email: (u.email || "").toLowerCase(),
defaultName: (u.displayName || "").replace(/\s+/g, "_").toLowerCase(),
defaultAvatar: u.photoURL || `https://api.dicebear.com/7.x/avataaars/svg?seed=${u.uid}`
});
} else {
const saved = localStorage.getItem("sunset_vibes_session");
if (saved) setAuthSession(JSON.parse(saved));
else setAuthSession(null);
}
});

const unsubUsers = onSnapshot(collection(db, "users"), (snap) => {
setUsers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
});

const unsubPosts = onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")), (snap) => {
setPosts(snap.docs.map(d => ({ id: d.id, ...d.data() })));
});

const unsubStories = onSnapshot(query(collection(db, "stories"), orderBy("createdAt", "asc")), (snap) => {
setStories(snap.docs.map(d => ({ id: d.id, ...d.data() })));
});

const unsubMessages = onSnapshot(query(collection(db, "messages"), orderBy("createdAt", "asc")), (snap) => {
setMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })));
});

return () => {
unsubAuth(); unsubUsers(); unsubPosts(); unsubStories(); unsubMessages();
};
}, [fbReady]);

// Usuario actual registrado en la colección users
const currentUserDoc = useMemo(() => {
if (!authSession) return null;
return users.find(u => u.uid === authSession.uid && u.username) || null;
}, [users, authSession]);

// Verificar si es joellpethers@gmail.com
const isAdmin = useMemo(() => {
const emailToCheck = (currentUserDoc?.email || authSession?.email || "").toLowerCase();
return emailToCheck === ADMIN_EMAIL;
}, [currentUserDoc, authSession]);

// Agrupar Historias por Persona (Estilo Instagram: todas las de una persona juntas)
const storyGroups = useMemo(() => {
const map = new Map();
stories.forEach((st) => {
if (!map.has(st.userId)) {
const uObj = users.find(u => u.uid === st.userId);
map.set(st.userId, {
userId: st.userId,
userName: uObj?.username || st.userName,
userAvatar: uObj?.avatar || st.userAvatar,
items: []
});
}
map.get(st.userId).items.push(st);
});
return Array.from(map.values());
}, [stories, users]);

// Temporizador de 5 segundos para fotos en el Visor de Historias estilo Instagram
useEffect(() => {
if (!storyViewer.open || storyViewer.paused) return;
const currentGroup = storyGroups[storyViewer.groupIndex];
if (!currentGroup) return;
const currentStory = currentGroup.items[storyViewer.storyIndex];
if (!currentStory) return;

// 5000ms (5 seg) para fotos, o la duración del video
const durationMs = currentStory.mediaType === "video"
? Math.max(5000, (currentStory.videoDuration || 8) * 1000)
: 5000;

const stepMs = 50;
const increment = (stepMs / durationMs) * 100;

const timer = setInterval(() => {
setStoryViewer((prev) => {
if (prev.paused || !prev.open) return prev;
if (prev.progress + increment >= 100) {
// Pasar automáticamente a la siguiente historia de la misma persona o a la siguiente persona
const grp = storyGroups[prev.groupIndex];
if (grp && prev.storyIndex < grp.items.length - 1) {
return { ...prev, storyIndex: prev.storyIndex + 1, progress: 0 };
} else if (prev.groupIndex < storyGroups.length - 1) {
return { ...prev, groupIndex: prev.groupIndex + 1, storyIndex: 0, progress: 0 };
} else {
return { open: false, groupIndex: 0, storyIndex: 0, paused: false, progress: 0 };
}
}
return { ...prev, progress: prev.progress + increment };
});
}, stepMs);

return () => clearInterval(timer);
}, [storyViewer.open, storyViewer.paused, storyViewer.groupIndex, storyViewer.storyIndex, storyGroups]);

// Controles de navegación de Historias (Adelantar/Atrás o siguiente/anterior persona)
const goNextStory = () => {
setStoryViewer((prev) => {
const grp = storyGroups[prev.groupIndex];
if (!grp) return { ...prev, open: false };
if (prev.storyIndex < grp.items.length - 1) {
return { ...prev, storyIndex: prev.storyIndex + 1, progress: 0 };
} else if (prev.groupIndex < storyGroups.length - 1) {
return { ...prev, groupIndex: prev.groupIndex + 1, storyIndex: 0, progress: 0 };
} else {
return { open: false, groupIndex: 0, storyIndex: 0, paused: false, progress: 0 };
}
});
};

const goPrevStory = () => {
setStoryViewer((prev) => {
if (prev.storyIndex > 0) {
return { ...prev, storyIndex: prev.storyIndex - 1, progress: 0 };
} else if (prev.groupIndex > 0) {
const prevGrp = storyGroups[prev.groupIndex - 1];
return {
...prev,
groupIndex: prev.groupIndex - 1,
storyIndex: Math.max(0, (prevGrp?.items?.length || 1) - 1),
progress: 0
};
} else {
return { ...prev, storyIndex: 0, progress: 0 };
}
});
};

const goNextPersonStories = () => {
setStoryViewer((prev) => {
if (prev.groupIndex < storyGroups.length - 1) {
return { ...prev, groupIndex: prev.groupIndex + 1, storyIndex: 0, progress: 0 };
}
return { open: false, groupIndex: 0, storyIndex: 0, paused: false, progress: 0 };
});

lastSeen: Date.now(),
updatedAt: Date.now()
};

}
}

const handleMediaFileChange = async (e) => {
const file = e.target.files?.[0];
if (!file) return;
setMediaError("");

if (file.type.startsWith("video/")) {
try {
const { dataUrl, duration } = await processVideoFile(file);
setMediaType("video");
setVideoDuration(duration);
setRawMediaUrl(dataUrl);
} catch (err) {
setMediaError(err.message);
setRawMediaUrl("");
}
} else {
const reader = new FileReader();

setVideoDuration(0);
setRawMediaUrl(ev.target.result);
};
}

{/* IMAGEN O VIDEO EN PANTALLA COMPLETA */}
<div className="w-full h-full flex items-center justify-center relative overflow-hidden">
<MediaRenderer
item={activeStoryItem}
className="w-full h-full object-contain"
autoPlay={true}
controls={false}
/>

{/* ZONAS INVISIBLES DE NAVEGACIÓN ESTILO INSTAGRAM (Izquierda atrás / Derecha adelante) */}
<div
onClick={() => { if (!wasLongPressRef.current) goPrevStory(); }}
className="absolute inset-y-16 left-0 w-1/3 z-20 cursor-pointer"
></div>
<div
onClick={() => { if (!wasLongPressRef.current) goNextStory(); }}
className="absolute inset-y-16 right-0 w-2/3 z-20 cursor-pointer"
></div>
</div>

{/* Pie de foto de la historia */}
{activeStoryItem.caption && (
<div className="absolute bottom-6 left-4 right-4 z-30 text-center pointer-events-none">
<span className="inline-block px-4 py-2 rounded-2xl bg-black/75 text-white text-sm font-medium border border-white/15">
{activeStoryItem.caption}
</span>
</div>
)}
</div>
)}

{/* ========================================================== */}
{/* VISTA PANTALLA COMPLETA DE PUBLICACIÓN (DESDE PERFIL/MURO) */}
{/* ========================================================== */}
{fullscreenPost && (
<div className="fixed inset-0 z-50 bg-black/95 backdrop-blur-md overflow-y-auto p-4 flex items-center justify-center">
<div className="glass-card rounded-3xl max-w-md w-full overflow-hidden my-auto border border-nude-300/40">
<div className="p-3.5 bg-burgundy-950 flex items-center justify-between border-b border-nude-300/20">
<button
onClick={() => openUserProfile(fullscreenPost.userId)}
className="flex items-center gap-2.5 text-left"
>
<img src={fullscreenPost.userAvatar} alt="" className="w-9 h-9 rounded-full object-cover" />
<span className="text-sm font-bold text-white hover:underline">@{fullscreenPost.userName}</span>
</button>
<button
onClick={() => setFullscreenPostId(null)}
className="px-3 py-1 rounded-full nude-btn text-xs"
>
Cerrar ✕
</button>
</div>

<div className="bg-black max-h-[55vh] flex items-center justify-center overflow-hidden">
<MediaRenderer
item={fullscreenPost}
className="w-full max-h-[55vh] object-contain"
onDoubleClick={() => toggleLike(fullscreenPost)}
/>
</div>

<div className="p-4 space-y-3">
<div className="flex items-center gap-2.5">
<button
onClick={() => toggleLike(fullscreenPost)}
className={`flex items-center gap-1.5 text-xs font-extrabold px-3.5 py-1.5 rounded-full ${
(fullscreenPost.likes || []).includes(currentUserDoc.uid)
? "bg-rose-500 text-white"
: "light-surface"
}`}
>
<span>{(fullscreenPost.likes || []).includes(currentUserDoc.uid) ? "❤️" : "🤍"}</span>
<span>{fullscreenPost.likes?.length || 0} Me gusta</span>
</button>

<button
onClick={() => setShareModalPost(fullscreenPost)}
className="flex items-center gap-1.5 text-xs font-extrabold px-3.5 py-1.5 rounded-full nude-btn"
>
<span>📤</span>
<span>Compartir</span>
</button>
</div>

{fullscreenPost.caption && (
<p className="text-sm text-white">
<span className="font-bold text-nude-300 mr-1.5">@{fullscreenPost.userName}:</span>
{fullscreenPost.caption}
</p>
)}

<div className="space-y-1.5 max-h-36 overflow-y-auto no-scrollbar pt-2 border-t border-nude-300/20">
{(fullscreenPost.comments || []).map(c => (
<div key={c.id} className="flex items-center justify-between text-xs text-nude-100">
<p>
<button
onClick={() => openUserProfile(c.userId)}
className="font-bold text-white mr-1.5 hover:underline"
>
@{c.userName}:
</button>
{c.text}
</p>
{(c.userId === currentUserDoc.uid || isAdmin) && (
<button onClick={() => handleDeleteComment(fullscreenPost, c)} className="text-rose-300">✕</button>
)}
</div>
))}
</div>

<div className="flex items-center gap-2 pt-1">
<input
type="text"
placeholder="Escribe un comentario..."
value={commentInputs[fullscreenPost.id] || ""}
onChange={(e) => setCommentInputs(prev => ({ ...prev, [fullscreenPost.id]: e.target.value }))}
onKeyDown={(e) => e.key === "Enter" && handleAddComment(fullscreenPost.id)}
className="flex-1 px-3.5 py-2 rounded-full bg-burgundy-950 border border-nude-300/35 text-xs text-white"
/>
<button
onClick={() => handleAddComment(fullscreenPost.id)}
className="px-4 py-2 rounded-full nude-btn text-xs"
>
Enviar
</button>
</div>
</div>
</div>
</div>
)}

{/* ========================================================== */}
{/* MODAL: ESTUDIO DE CREACIÓN Y EDICIÓN (FILTROS/TEXTO/CORTE) */}
{/* ========================================================== */}
{uploadModal.open && (
<div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md overflow-y-auto p-4 flex items-center justify-center">
<div className="glass-card rounded-3xl max-w-md w-full p-5 border border-nude-300/40 space-y-4 my-auto">
<div className="flex items-center justify-between">
<h3 className="font-serif text-xl font-bold text-white">
{uploadModal.type === "story"
? "Estudio de Historia Sunset"
: uploadModal.withChallenge
? "Subir con Reto Sunset"
: "Estudio Fotográfico y Video"}
</h3>
<button
onClick={() => {
resetUploadStudio();
setUploadModal({ open: false, type: "post", withChallenge: false });
}}
className="text-nude-300 hover:text-white text-sm font-bold"
>
✕ Cerrar
</button>
</div>

<form onSubmit={handlePublishEditedMedia} className="space-y-3.5">
{/* Previsualización Interactiva con Filtro, Recorte, Texto y Sticker en vivo */}
<label className="block w-full cursor-pointer">
<div className="w-full h-64 rounded-2xl border-2 border-dashed border-nude-300/50 bg-black flex items-center justify-center overflow-hidden relative">
{rawMediaUrl ? (
<div className="relative w-full h-full flex items-center justify-center overflow-hidden">
{mediaType === "video" ? (
<video
src={rawMediaUrl}
controls
style={{ filter: selectedFilter.css }}
className={`w-full h-full ${selectedCrop.class}`}
/>
) : (
<img
src={rawMediaUrl}
alt="Preview"
style={{ filter: selectedFilter.css }}
className={`w-full h-full ${selectedCrop.class}`}
/>
)}

{overlaySticker && (
<span className="absolute top-3 right-3 text-4xl drop-shadow-lg pointer-events-none">
{overlaySticker}
</span>
)}

{overlayText.trim() && (
<div
style={{
top: `${overlayYPos}%`,
backgroundColor: overlayColor.bg,
color: overlayColor.hex
}}
className="absolute left-1/2 -translate-x-1/2 -translate-y-1/2 px-4 py-1.5 rounded-xl font-extrabold text-sm text-center pointer-events-none shadow-xl max-w-[88%]"
>
{overlayText}
</div>
)}
</div>
) : (
<div className="text-center p-4">
<span className="text-3xl">📸 🎥 🎨</span>
<p className="text-xs font-bold text-white mt-2">
Toca aquí para elegir o grabar Foto / Video (Máx 15s)
</p>
<p className="text-[11px] text-nude-300 mt-1">
Luego podrás aplicar filtros, recortes, textos y stickers
</p>
</div>
)}
</div>
<input
type="file"
accept="image/*,video/*"
onChange={handleMediaFileChange}
className="hidden"
/>
</label>

{/* Herramientas de Edición (Aparecen cuando ya elegiste foto o video) */}
{rawMediaUrl && (
<div className="space-y-3 bg-burgundy-950/90 p-3.5 rounded-2xl border border-nude-300/25">
{/* 1. Filtros de Color */}
<div>
<p className="text-[10px] uppercase tracking-wider text-nude-300 font-bold mb-1.5">
1. Filtro Sunset
</p>
<div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
{MEDIA_FILTERS.map(f => (
<button
type="button"
key={f.id}
onClick={() => setSelectedFilter(f)}
className={`px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 ${
selectedFilter.id === f.id ? "nude-btn" : "bg-burgundy-900 text-nude-200"
}`}
>
{f.name}
</button>
))}
</div>
</div>

{/* 2. Recorte / Encuadre */}
<div>
<p className="text-[10px] uppercase tracking-wider text-nude-300 font-bold mb-1.5">
2. Recorte de Encuadre
</p>
<div className="grid grid-cols-4 gap-1.5">
{CROP_RATIOS.map(cr => (
<button
type="button"
key={cr.id}
onClick={() => setSelectedCrop(cr)}
className={`py-1.5 rounded-xl text-[11px] font-bold ${
selectedCrop.id === cr.id ? "nude-btn" : "bg-burgundy-900 text-nude-200"
}`}
>
{cr.label}
</button>
))}
</div>
</div>

{/* 3. Escritura sobre la Foto/Video */}
<div className="space-y-2">
<p className="text-[10px] uppercase tracking-wider text-nude-300 font-bold">
3. Texto sobre la imagen y posición vertical
</p>
<input
type="text"
placeholder="Escribe texto sobre la foto/video..."
value={overlayText}
onChange={(e) => setOverlayText(e.target.value)}
className="w-full px-3 py-2 rounded-xl bg-burgundy-900 border border-nude-300/30 text-xs text-white"
/>
{overlayText.trim() && (
<div className="flex items-center justify-between gap-3">
<div className="flex gap-1.5">
{TEXT_COLORS.map(tc => (
<button
type="button"
key={tc.id}
onClick={() => setOverlayColor(tc)}
style={{ backgroundColor: tc.hex }}
className={`w-6 h-6 rounded-full border-2 ${
overlayColor.id === tc.id ? "border-amber-400 scale-110" : "border-white/30"
}`}
></button>
))}
</div>
<input
type="range"
min="15"
max="85"
value={overlayYPos}
onChange={(e) => setOverlayYPos(Number(e.target.value))}
className="flex-1 accent-nude-300"
/>
</div>
)}
</div>

{/* 4. Stickers */}
<div>
<p className="text-[10px] uppercase tracking-wider text-nude-300 font-bold mb-1">
4. Sticker Decorativo
</p>
<div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
<button
type="button"
onClick={() => setOverlaySticker("")}
className="px-2 py-1 rounded-lg bg-burgundy-900 text-[10px] text-nude-200 font-bold"
>
Ninguno
</button>
{STICKERS.map(st => (
<button
type="button"
key={st}
onClick={() => setOverlaySticker(st)}
className={`text-lg px-2 py-0.5 rounded-lg ${
overlaySticker === st ? "bg-nude-300" : "bg-burgundy-900"
}`}
>
{st}
</button>
))}
</div>
</div>
</div>
)}

{mediaError && (
<div className="p-3 rounded-xl bg-rose-950 border border-rose-400 text-xs text-rose-200 font-semibold">
⚠️ {mediaError}
</div>
)}

<input
type="text"
placeholder="Pie de foto o descripción para el muro..."
value={caption}
onChange={(e) => setCaption(e.target.value)}
className="w-full px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/35 text-xs text-white"
/>

<button
type="submit"
disabled={!rawMediaUrl || isSubmitting}
className="w-full py-3.5 rounded-xl nude-btn text-sm disabled:opacity-40 shadow-lg"
>
{isSubmitting ? "Procesando y Publicando..." : "Publicar Ahora ✨"}
</button>
</form>
</div>
</div>
)}

{/* MODAL COMPARTIR */}
{shareModalPost && (
<div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
<div className="glass-card rounded-3xl max-w-sm w-full p-6 border border-nude-300/40 space-y-4">
<div className="flex items-center justify-between">
<h3 className="font-serif text-xl font-bold text-white">Compartir Publicación</h3>
<button onClick={() => setShareModalPost(null)} className="text-nude-300 font-bold">✕</button>
</div>

<button
onClick={() => handleSendPostToChat("group")}
className="w-full py-3 px-4 rounded-2xl nude-btn text-xs flex items-center justify-center gap-2 shadow"
>
🎉 Enviar al Chat Grupal
</button>

<button
onClick={() => handleExternalShare(shareModalPost)}
className="w-full py-3 px-4 rounded-2xl bg-burgundy-800 border border-nude-300/40 text-white font-bold text-xs flex items-center justify-center gap-2"
>
📲 Compartir fuera de la App (WhatsApp / Más)
</button>

<div className="pt-2 border-t border-nude-300/20">
<p className="text-xs font-bold text-nude-300 mb-2">Enviar al chat privado de:</p>
<div className="max-h-44 overflow-y-auto space-y-2 no-scrollbar">
{users.filter(u => u.uid !== currentUserDoc.uid && u.username).map(u => (
<button
key={u.uid}
onClick={() => handleSendPostToChat("private", u)}
className="w-full p-2.5 rounded-xl bg-burgundy-950 hover:bg-burgundy-900 flex items-center justify-between border border-nude-300/20"
>
<div className="flex items-center gap-2.5">
<img src={u.avatar} alt="" className="w-8 h-8 rounded-full object-cover" />
<span className="text-xs font-bold text-white">@{u.username}</span>
</div>
<span className="text-xs text-nude-300 font-bold">Enviar →</span>
</button>
))}
</div>
</div>
</div>
</div>
)}

{/* MODAL EDITAR PUBLICACIÓN (PROPIA O SUPER ADMIN) */}
{adminEditPost && (
<div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
<div className="glass-card rounded-3xl max-w-sm w-full p-6 border border-nude-300/40 space-y-4">
<div className="flex items-center justify-between">
<h3 className="font-serif text-xl font-bold text-white">Editar Publicación</h3>
<button onClick={() => setAdminEditPost(null)} className="text-nude-300 font-bold">✕</button>
</div>
<form onSubmit={handleSavePostEdit} className="space-y-3">
<div>
<label className="text-xs font-bold text-nude-200">Pie de foto</label>
<input
type="text"
value={adminEditPost.caption || ""}
onChange={(e) => setAdminEditPost({ ...adminEditPost, caption: e.target.value })}
className="w-full mt-1 px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-xs text-white"
/>
</div>
<button type="submit" className="w-full py-3 rounded-xl nude-btn text-xs">
Guardar Cambios
</button>
</form>
</div>
</div>
)}

{/* MODAL ADMIN EDITAR USUARIO */}
{adminEditUser && isAdmin && (
<div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
<div className="glass-card rounded-3xl max-w-sm w-full p-6 border border-nude-300/40 space-y-4">
<div className="flex items-center justify-between">
<h3 className="font-serif text-xl font-bold text-white">Editar Invitado (Admin)</h3>
<button onClick={() => setAdminEditUser(null)} className="text-nude-300 font-bold">✕</button>
</div>
<form onSubmit={handleAdminSaveUser} className="space-y-3">
<div>
<label className="text-xs font-bold text-nude-200">@Usuario</label>
<input
type="text"
value={adminEditUser.username || ""}
onChange={(e) => setAdminEditUser({ ...adminEditUser, username: e.target.value })}
className="w-full mt-1 px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-xs text-white"
/>
</div>
<button type="submit" className="w-full py-3 rounded-xl nude-btn text-xs">
Actualizar Invitado
</button>
</form>
</div>
</div>
)}

{/* MODAL EDITAR MI PERFIL */}
{editProfileModal && (
<div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
<div className="glass-card rounded-3xl max-w-sm w-full p-6 border border-nude-300/40 space-y-4">
<div className="flex items-center justify-between">
<h3 className="font-serif text-xl font-bold text-white">Editar Mi Perfil</h3>
<button onClick={() => setEditProfileModal(false)} className="text-nude-300 font-bold">✕</button>
</div>

<form onSubmit={handleSaveProfileEdit} className="space-y-3.5">
<div className="flex flex-col items-center">
<label className="cursor-pointer text-center">
<img
src={newProfileAvatar || currentUserDoc.avatar}
alt=""
className="w-24 h-24 rounded-full object-cover mx-auto border-2 border-nude-300"
/>
<span className="mt-2 inline-block text-xs px-3 py-1 rounded-full nude-btn">
📷 Cambiar Foto
</span>
<input
type="file"
accept="image/*"
onChange={async (e) => {
const f = e.target.files?.[0];
if (f) setNewProfileAvatar(await compressSimpleImage(f));
}}
className="hidden"
/>
</label>
</div>

<div>
<label className="text-xs text-nude-200 font-bold">Tu @usuario único</label>
<input
type="text"
required
value={newProfileUsername}
onChange={(e) => setNewProfileUsername(e.target.value)}
className="w-full mt-1 px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-sm text-white"
/>
</div>

<div>
<label className="text-xs text-nude-200 font-bold">Nueva contraseña (opcional)</label>
<input
type="password"
placeholder="Dejar vacío para mantener la actual"
value={newProfilePassword}
onChange={(e) => setNewProfilePassword(e.target.value)}
className="w-full mt-1 px-4 py-2.5 rounded-xl bg-burgundy-950 border border-nude-300/40 text-sm text-white"
/>
</div>

{profileEditError && <p className="text-xs text-rose-300 font-bold">{profileEditError}</p>}

<button type="submit" className="w-full py-3 rounded-xl nude-btn text-xs shadow">
Guardar Cambios
</button>
</form>
</div>
</div>
)}

{/* MODAL QR */}
{qrModalOpen && (
<div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
<div className="glass-card rounded-3xl max-w-sm w-full p-6 text-center border border-nude-300/40 space-y-4">
<h3 className="font-serif text-2xl font-bold text-white">QR Oficial Sunset Vibes</h3>
<p className="text-xs text-nude-200">
Escanea para entrar al muro, usar el estudio de filtros y unirte al Chat Grupal.
</p>
<div className="bg-white p-4 rounded-2xl inline-block mx-auto shadow-2xl">
<img
src={`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(window.location.href)}`}
alt="QR Sunset Vibes"
className="w-48 h-48"
/>
</div>
<button onClick={() => setQrModalOpen(false)} className="w-full py-3 rounded-xl nude-btn text-xs">
Listo
</button>
</div>
</div>
)}

{/* BARRA DE NAVEGACIÓN INFERIOR */}
<nav className="fixed bottom-0 left-0 right-0 z-40 glass-nav max-w-lg mx-auto px-3 py-2.5 flex items-center justify-around">
<button
onClick={() => {
setViewedProfileUid(null);
setActiveTab("feed");
setUnreadStoriesCount(0);
}}
className={`relative flex flex-col items-center gap-0.5 text-[11px] font-bold ${
activeTab === "feed" && !viewedProfileUser ? "text-nude-300" : "text-white/60"
}`}
>
<span className="text-lg">🏠</span>
<span>Muro</span>
{unreadStoriesCount > 0 && (
<span className="absolute -top-1 right-0 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] flex items-center justify-center font-extrabold">
{unreadStoriesCount}
</span>
)}
</button>

<button
onClick={() => {
setViewedProfileUid(null);
setActiveTab("search");
}}
className={`flex flex-col items-center gap-0.5 text-[11px] font-bold ${
activeTab === "search" && !viewedProfileUser ? "text-nude-300" : "text-white/60"
}`}
>
<span className="text-lg">🔍</span>
<span>Buscar</span>
</button>

<button
onClick={() => {
resetUploadStudio();
setUploadModal({ open: true, type: "post", withChallenge: false });
}}
className="w-12 h-12 -mt-5 rounded-full nude-btn text-2xl shadow-2xl flex items-center justify-center border-2 border-burgundy-950"
>
+
</button>

<button
onClick={() => {
setViewedProfileUid(null);
setActiveTab("chat");
setUnreadChatCount(0);
}}
className={`relative flex flex-col items-center gap-0.5 text-[11px] font-bold ${
activeTab === "chat" && !viewedProfileUser ? "text-nude-300" : "text-white/60"
}`}
>
<span className="text-lg">💬</span>
<span>Chat</span>
{unreadChatCount > 0 && (
<span className="absolute -top-1 right-0 w-4 h-4 rounded-full bg-emerald-500 text-[#090105] text-[9px] flex items-center justify-center font-extrabold">
{unreadChatCount}
</span>
)}
</button>

<button
onClick={() => {
setViewedProfileUid(null);
setActiveTab("profile");
}}
className={`flex flex-col items-center gap-0.5 text-[11px] font-bold ${
activeTab === "profile" && !viewedProfileUser ? "text-nude-300" : "text-white/60"
}`}
>
<span className="text-lg">👤</span>
<span>Perfil</span>
</button>

{isAdmin && (
<button
onClick={() => {
setViewedProfileUid(null);
setActiveTab("admin");
}}
className={`flex flex-col items-center gap-0.5 text-[11px] font-extrabold ${
activeTab === "admin" && !viewedProfileUser ? "text-amber-300" : "text-amber-200/70"
}`}
>
<span className="text-lg">👑</span>
<span>Admin</span>
</button>
)}
</nav>
</div>
);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SunsetVibesApp />);
</script>
</body>
</html>
